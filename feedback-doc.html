<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>מסמך תקלות, הערות ובקשות - StudyStreak Pro</title>
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js?v=20261030_3"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        html, body {
            font-family: 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f5f5f4;
            overflow-x: hidden;
            max-width: 100vw;
        }
        .doc-paper {
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        .msg-wrap {
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.6;
        }
        /* Prevent iOS Safari zoom on input focus */
        @media screen and (max-width: 768px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }
        @media print {
            .no-print { display: none !important; }
            body { background: #fff; }
            .doc-paper { box-shadow: none; border: none; }
        }
    </style>
</head>
<body class="text-stone-800 min-h-screen pb-14">

    <!-- Mobile-First Compact Toolbar -->
    <header class="bg-white/95 backdrop-blur-md border-b border-stone-200 sticky top-0 z-30 shadow-2xs no-print">
        <div class="max-w-5xl mx-auto px-3 sm:px-5 py-2.5 sm:py-3 space-y-2">
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2.5 min-w-0">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-purple-600 to-indigo-600 text-white flex items-center justify-center text-lg shadow-xs shrink-0">
                        📝
                    </div>
                    <div class="min-w-0">
                        <div class="flex items-center gap-1.5">
                            <h1 class="font-black text-sm sm:text-lg text-stone-900 truncate">מסמך תקלות ובקשות</h1>
                            <span id="sync-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0 shadow-[0_0_6px_rgba(16,185,129,0.6)]" title="מחובר בלייב לענן"></span>
                        </div>
                        <p class="text-[11px] text-stone-400 truncate">StudyStreak Pro • מסמך מתעדכן בזמן אמת</p>
                    </div>
                </div>

                <a href="./index.html" class="px-2.5 py-1.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-bold shrink-0 active:scale-95 transition-all">
                    לאפליקציה ←
                </a>
            </div>

            <!-- Action Buttons Row (Fits Phone Screen Cleanly) -->
            <div class="grid grid-cols-3 sm:flex sm:items-center gap-1.5 sm:gap-2 pt-1 border-t border-stone-100">
                <a href="./admin-log-doc.html" class="col-span-3 sm:col-span-1 justify-center px-3 py-1.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-bold flex items-center gap-1 transition-all active:scale-95">
                    <span>🛡️</span> מעבר ליומן שינויי אדמין ↗️
                </a>
                <button onclick="exportToWordDoc()" class="justify-center px-2.5 py-1.5 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-[11px] sm:text-xs font-bold flex items-center gap-1 transition-all active:scale-95">
                    <span>📄</span> קובץ Docs
                </button>
                <button onclick="exportToCSV()" class="justify-center px-2.5 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-[11px] sm:text-xs font-bold flex items-center gap-1 transition-all active:scale-95">
                    <span>📊</span> קובץ אקסל
                </button>
                <button onclick="window.print()" class="justify-center px-2.5 py-1.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 text-[11px] sm:text-xs font-bold flex items-center gap-1 transition-all active:scale-95">
                    <span>🖨️</span> PDF
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-3 sm:px-5 pt-4 space-y-3.5">

        <!-- Compact 4-Stat Grid (Fits Phone Without Overflow) -->
        <section class="grid grid-cols-4 gap-2 sm:gap-3 no-print">
            <div class="bg-white p-2.5 sm:p-4 rounded-2xl border border-stone-200 text-center shadow-2xs">
                <div class="text-[10px] sm:text-xs text-stone-400 font-bold truncate">סה"כ</div>
                <div id="stat-total" class="text-lg sm:text-2xl font-black text-stone-800 mt-0.5">0</div>
            </div>
            <div class="bg-white p-2.5 sm:p-4 rounded-2xl border border-rose-200 text-center shadow-2xs">
                <div class="text-[10px] sm:text-xs text-rose-500 font-bold truncate">לטיפול 🔴</div>
                <div id="stat-open" class="text-lg sm:text-2xl font-black text-rose-600 mt-0.5">0</div>
            </div>
            <div class="bg-white p-2.5 sm:p-4 rounded-2xl border border-amber-200 text-center shadow-2xs">
                <div class="text-[10px] sm:text-xs text-amber-600 font-bold truncate">תקלות 🐞</div>
                <div id="stat-bugs" class="text-lg sm:text-2xl font-black text-amber-600 mt-0.5">0</div>
            </div>
            <div class="bg-white p-2.5 sm:p-4 rounded-2xl border border-emerald-200 text-center shadow-2xs">
                <div class="text-[10px] sm:text-xs text-emerald-600 font-bold truncate">טופלו ✅</div>
                <div id="stat-resolved" class="text-lg sm:text-2xl font-black text-emerald-600 mt-0.5">0</div>
            </div>
        </section>

        <!-- Search, Filters & View Switcher -->
        <section class="bg-white p-3 sm:p-4 rounded-2xl border border-stone-200 shadow-2xs space-y-2.5 no-print">
            <div class="relative">
                <input
                    id="search-input"
                    type="text"
                    oninput="renderAll()"
                    placeholder="חיפוש לפי שם משתמשת או תוכן הודעה..."
                    class="w-full pl-3 pr-9 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs font-bold outline-none focus:bg-white focus:border-purple-400"
                />
                <span class="absolute right-3 top-2.5 text-stone-400 text-sm">🔍</span>
            </div>

            <div class="grid grid-cols-2 sm:flex sm:items-center justify-between gap-2">
                <select id="filter-status" onchange="renderAll()" class="px-2.5 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs font-bold outline-none">
                    <option value="all">כל הסטטוסים</option>
                    <option value="open">פתוח לטיפול 🔴</option>
                    <option value="in_progress">בטיפול ⏳</option>
                    <option value="resolved">טופל ✅</option>
                </select>

                <select id="filter-type" onchange="renderAll()" class="px-2.5 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs font-bold outline-none">
                    <option value="all">כל הסוגים</option>
                    <option value="bug">🐞 תקלות</option>
                    <option value="request">💡 בקשות</option>
                    <option value="comment">💬 הערות</option>
                </select>

                <div class="col-span-2 sm:col-span-1 flex items-center bg-stone-100 p-1 rounded-xl border border-stone-200 sm:mr-auto">
                    <button id="btn-view-docs" onclick="setViewMode('docs')" class="flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-purple-700 shadow-2xs">
                        📄 תצוגת דוקס
                    </button>
                    <button id="btn-view-sheets" onclick="setViewMode('sheets')" class="flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-stone-600">
                        📊 תצוגת שיטס
                    </button>
                </div>
            </div>

            <!-- Collapsible Quick Add Note for Owner -->
            <details class="group pt-2 border-t border-stone-100">
                <summary class="cursor-pointer text-xs font-bold text-purple-700 hover:text-purple-800 flex items-center gap-1.5 select-none">
                    <span>➕</span> הוספת הערה / משימה חדשה למסמך (כתיבה ישירה שלך)
                </summary>
                <form onsubmit="handleManualAdd(event)" class="mt-2.5 space-y-2.5 bg-purple-50/50 p-3 rounded-xl border border-purple-100">
                    <select id="manual-type" class="w-full p-2 bg-white border border-stone-200 rounded-xl text-xs font-bold">
                        <option value="bug">🐞 תקלה לבדיקה</option>
                        <option value="request">💡 רעיון / שדרוג</option>
                        <option value="comment">💬 הערה אישית</option>
                    </select>
                    <textarea id="manual-msg" rows="2" required placeholder="כתבי כאן הערה או דבר שתרצי לזכור לטפל בו..." class="w-full p-2.5 bg-white border border-stone-200 rounded-xl text-xs font-medium"></textarea>
                    <button type="submit" class="w-full py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl text-xs shadow-xs transition-all active:scale-95">
                        הוספה למסמך 💾
                    </button>
                </form>
            </details>
        </section>

        <!-- Document Paper Container -->
        <section class="doc-paper rounded-2xl sm:rounded-3xl border border-stone-200 p-3.5 sm:p-6 min-h-[400px]">
            <div class="flex items-center justify-between pb-3 mb-4 border-b border-stone-100">
                <div>
                    <h2 class="text-sm sm:text-base font-black text-stone-800">פירוט כל הדיווחים והבקשות</h2>
                    <p id="last-updated-text" class="text-[11px] text-stone-400">טוען נתונים...</p>
                </div>
                <span id="visible-count-badge" class="text-[11px] font-bold bg-stone-100 text-stone-600 px-2.5 py-1 rounded-full shrink-0">0 רשומות</span>
            </div>

            <!-- DOCS VIEW (Mobile & Desktop Friendly Cards) -->
            <div id="docs-container" class="space-y-3"></div>

            <!-- SHEETS VIEW (Responsive Table) -->
            <div id="sheets-container" class="hidden overflow-x-auto -mx-3.5 px-3.5 sm:mx-0 sm:px-0">
                <table class="w-full border-collapse text-right text-xs">
                    <thead>
                        <tr class="bg-stone-100 text-stone-700 border-y border-stone-300 font-black">
                            <th class="p-2.5 border-l border-stone-200 whitespace-nowrap">משתמשת ותאריך</th>
                            <th class="p-2.5 border-l border-stone-200">תוכן ההודעה והערת מעקב</th>
                            <th class="p-2.5 w-24 text-center">סטטוס</th>
                        </tr>
                    </thead>
                    <tbody id="sheets-tbody" class="divide-y divide-stone-200 align-top"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        let allItems = [];
        let currentViewMode = 'docs';

        function formatDateTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return iso;
            return d.toLocaleDateString('he-IL', {
                day: '2-digit', month: '2-digit', year: '2-digit'
            }) + ' ' + d.toLocaleTimeString('he-IL', {
                hour: '2-digit', minute: '2-digit'
            });
        }

        function getTypeBadge(type) {
            if (type === 'bug') return { label: '🐞 תקלה', cls: 'bg-rose-50 text-rose-700 border-rose-200' };
            if (type === 'request') return { label: '💡 בקשה', cls: 'bg-amber-50 text-amber-800 border-amber-200' };
            return { label: '💬 הערה', cls: 'bg-purple-50 text-purple-700 border-purple-200' };
        }

        function getStatusBadge(status) {
            if (status === 'resolved') return { label: 'טופל ✅', cls: 'bg-emerald-50 text-emerald-700 border-emerald-300' };
            if (status === 'in_progress') return { label: 'בטיפול ⏳', cls: 'bg-amber-50 text-amber-800 border-amber-300' };
            return { label: 'פתוח 🔴', cls: 'bg-rose-50 text-rose-700 border-rose-300' };
        }

        function setViewMode(mode) {
            currentViewMode = mode;
            const docsBtn = document.getElementById('btn-view-docs');
            const sheetsBtn = document.getElementById('btn-view-sheets');
            const docsCont = document.getElementById('docs-container');
            const sheetsCont = document.getElementById('sheets-container');

            if (mode === 'docs') {
                docsBtn.className = 'flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-purple-700 shadow-2xs';
                sheetsBtn.className = 'flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-stone-600';
                docsCont.classList.remove('hidden');
                sheetsCont.classList.add('hidden');
            } else {
                sheetsBtn.className = 'flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-white text-purple-700 shadow-2xs';
                docsBtn.className = 'flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-stone-600';
                sheetsCont.classList.remove('hidden');
                docsCont.classList.add('hidden');
            }
            renderAll();
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        async function persistItems(nextItems) {
            allItems = nextItems;
            try {
                localStorage.setItem('studyStreak_system_feedback', JSON.stringify(allItems));
            } catch (e) {}
            renderAll();

            if (db) {
                try {
                    await db.collection('task_attachments').doc('system_feedback_doc').set({
                        items: allItems,
                        updatedAt: Date.now(),
                        docType: 'system_feedback'
                    }, { merge: true });
                } catch (err) {
                    console.error('Error syncing feedback doc:', err);
                }
            }
        }

        async function updateItemStatus(id, newStatus) {
            const next = allItems.map(item => item.id === id ? { ...item, status: newStatus } : item);
            await persistItems(next);
        }

        async function updateAdminNote(id, noteVal) {
            const next = allItems.map(item => item.id === id ? { ...item, adminNote: noteVal } : item);
            await persistItems(next);
        }

        async function deleteItem(id) {
            if (!confirm('למחוק את הפנייה הזו מהמסמך?')) return;
            const next = allItems.filter(item => item.id !== id);
            await persistItems(next);
        }

        async function handleManualAdd(e) {
            e.preventDefault();
            const type = document.getElementById('manual-type').value;
            const msgEl = document.getElementById('manual-msg');
            const message = (msgEl.value || '').trim();
            if (!message) return;

            const newItem = {
                id: 'fb_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                timestamp: new Date().toISOString(),
                type,
                message,
                senderName: 'רישום עצמי (מנהלת)',
                senderUsername: 'admin',
                status: 'open',
                adminNote: ''
            };

            msgEl.value = '';
            await persistItems([newItem, ...allItems]);
        }

        function getFilteredItems() {
            const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
            const statusFilter = document.getElementById('filter-status')?.value || 'all';
            const typeFilter = document.getElementById('filter-type')?.value || 'all';

            return allItems.filter(item => {
                if (!item) return false;
                const st = item.status || 'open';
                if (statusFilter !== 'all' && st !== statusFilter) return false;
                if (typeFilter !== 'all' && (item.type || 'bug') !== typeFilter) return false;
                if (q) {
                    const hay = `${item.message || ''} ${item.senderName || ''} ${item.senderUsername || ''} ${item.adminNote || ''}`.toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });
        }

        function renderAll() {
            document.getElementById('stat-total').textContent = allItems.length;
            document.getElementById('stat-open').textContent = allItems.filter(i => (i.status || 'open') !== 'resolved').length;
            document.getElementById('stat-bugs').textContent = allItems.filter(i => (i.type || 'bug') === 'bug').length;
            document.getElementById('stat-resolved').textContent = allItems.filter(i => i.status === 'resolved').length;

            const filtered = getFilteredItems();
            document.getElementById('visible-count-badge').textContent = `${filtered.length} רשומות`;
            document.getElementById('last-updated-text').textContent = `עודכן: ${new Date().toLocaleTimeString('he-IL')}`;

            const docsCont = document.getElementById('docs-container');
            const sheetsBody = document.getElementById('sheets-tbody');

            if (filtered.length === 0) {
                const emptyHtml = `
                    <div class="text-center py-12 text-stone-400">
                        <div class="text-4xl mb-2">✨</div>
                        <div class="font-bold text-sm text-stone-600">אין פניות או דיווחים להצגה כרגע</div>
                        <div class="text-xs mt-1">כל הערה, תקלה או בקשה שמשתמשת תכתוב באפליקציה תופיע כאן אוטומטית.</div>
                    </div>
                `;
                docsCont.innerHTML = emptyHtml;
                sheetsBody.innerHTML = `<tr><td colspan="3">${emptyHtml}</td></tr>`;
                return;
            }

            // Docs View
            docsCont.innerHTML = filtered.map((item, idx) => {
                const tBadge = getTypeBadge(item.type);
                const sBadge = getStatusBadge(item.status || 'open');
                const isResolved = item.status === 'resolved';

                return `
                    <article class="p-3.5 sm:p-5 rounded-2xl border transition-all ${isResolved ? 'bg-stone-50/70 border-stone-200 opacity-85' : 'bg-white border-stone-200 shadow-2xs'}">
                        <div class="flex items-start justify-between gap-2 pb-2.5 mb-2.5 border-b border-stone-100">
                            <div class="min-w-0 flex-1">
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <span class="text-[11px] font-black text-stone-400">#${filtered.length - idx}</span>
                                    <span class="text-[11px] font-bold px-2 py-0.5 rounded-lg border ${tBadge.cls}">${tBadge.label}</span>
                                    <span class="font-bold text-xs sm:text-sm text-stone-900">${escapeHtml(item.senderName || 'משתמשת')}</span>
                                    ${item.senderUsername ? `<span class="text-[11px] text-stone-400 font-mono" dir="ltr">@${escapeHtml(item.senderUsername)}</span>` : ''}
                                </div>
                                <div class="text-[11px] text-stone-400 mt-0.5">${formatDateTime(item.timestamp)}</div>
                            </div>

                            <div class="flex items-center gap-1 shrink-0 no-print">
                                <select
                                    onchange="updateItemStatus('${item.id}', this.value)"
                                    class="text-[11px] font-bold px-2 py-1 rounded-lg border outline-none cursor-pointer ${sBadge.cls}">
                                    <option value="open" ${(item.status || 'open') === 'open' ? 'selected' : ''}>🔴 פתוח</option>
                                    <option value="in_progress" ${item.status === 'in_progress' ? 'selected' : ''}>⏳ בטיפול</option>
                                    <option value="resolved" ${item.status === 'resolved' ? 'selected' : ''}>✅ טופל</option>
                                </select>
                                <button onclick="deleteItem('${item.id}')" class="text-stone-400 hover:text-rose-600 p-1 rounded-lg" title="מחק">🗑️</button>
                            </div>
                        </div>

                        <div class="msg-wrap text-xs sm:text-sm text-stone-800 bg-stone-50 p-3 sm:p-4 rounded-xl border border-stone-100 font-medium">${escapeHtml(item.message)}</div>

                        <div class="mt-2.5 flex items-center gap-2">
                            <span class="text-[11px] font-bold text-stone-500 shrink-0">📌 הערה:</span>
                            <input
                                type="text"
                                value="${escapeHtml(item.adminNote || '')}"
                                placeholder="הערת מעקב שלי..."
                                onblur="updateAdminNote('${item.id}', this.value)"
                                onkeydown="if(event.key==='Enter'){this.blur();}"
                                class="flex-1 min-w-0 bg-transparent border-b border-dashed border-stone-300 focus:border-purple-500 px-1.5 py-1 text-xs font-medium text-stone-700 outline-none"
                            />
                        </div>
                    </article>
                `;
            }).join('');

            // Sheets View (Fits Mobile & Desktop)
            sheetsBody.innerHTML = filtered.map(item => {
                const tBadge = getTypeBadge(item.type);
                const sBadge = getStatusBadge(item.status || 'open');
                return `
                    <tr class="${item.status === 'resolved' ? 'bg-stone-50/60 text-stone-500' : 'bg-white'}">
                        <td class="p-2.5 border-l border-stone-200 w-28 sm:w-40">
                            <span class="inline-block text-[10px] font-bold px-1.5 py-0.5 rounded border mb-1 ${tBadge.cls}">${tBadge.label}</span>
                            <div class="font-bold text-stone-800 text-xs">${escapeHtml(item.senderName || 'משתמשת')}</div>
                            <div class="text-[10px] text-stone-400 mt-0.5">${formatDateTime(item.timestamp)}</div>
                        </td>
                        <td class="p-2.5 border-l border-stone-200">
                            <div class="msg-wrap text-xs text-stone-800 font-medium mb-2">${escapeHtml(item.message)}</div>
                            <input
                                type="text"
                                placeholder="📌 הערת מעקב..."
                                value="${escapeHtml(item.adminNote || '')}"
                                onblur="updateAdminNote('${item.id}', this.value)"
                                class="w-full p-1.5 bg-stone-50 border border-stone-200 rounded-lg text-xs outline-none focus:bg-white focus:border-purple-400"
                            />
                        </td>
                        <td class="p-2 text-center">
                            <select
                                onchange="updateItemStatus('${item.id}', this.value)"
                                class="w-full text-[11px] font-bold px-1.5 py-1 rounded-lg border outline-none ${sBadge.cls}">
                                <option value="open" ${(item.status || 'open') === 'open' ? 'selected' : ''}>🔴 פתוח</option>
                                <option value="in_progress" ${item.status === 'in_progress' ? 'selected' : ''}>⏳ בטיפול</option>
                                <option value="resolved" ${item.status === 'resolved' ? 'selected' : ''}>✅ טופל</option>
                            </select>
                            <button onclick="deleteItem('${item.id}')" class="mt-2 text-[11px] text-stone-400 hover:text-rose-600 no-print">🗑️ מחק</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function exportToCSV() {
            const filtered = getFilteredItems();
            const headers = ['תאריך ושעה', 'שם משתמשת', 'כינוי', 'סוג פנייה', 'סטטוס', 'תוכן ההודעה', 'הערת מעקב'];
            const rows = filtered.map(item => [
                formatDateTime(item.timestamp),
                item.senderName || '',
                item.senderUsername || '',
                item.type === 'bug' ? 'תקלה' : item.type === 'request' ? 'בקשה' : 'הערה',
                item.status === 'resolved' ? 'טופל' : item.status === 'in_progress' ? 'בטיפול' : 'פתוח',
                item.message || '',
                item.adminNote || ''
            ]);
            const csvContent = '\uFEFF' + [headers, ...rows]
                .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
                .join('\r\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `StudyStreak_Feedback_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function exportToWordDoc() {
            const filtered = getFilteredItems();
            const lines = filtered.map((item, i) => {
                const t = item.type === 'bug' ? 'תקלה / באג' : item.type === 'request' ? 'בקשה / רעיון' : 'הערה כללית';
                const st = item.status === 'resolved' ? 'טופל ✅' : item.status === 'in_progress' ? 'בטיפול ⏳' : 'פתוח 🔴';
                return `
                    <div style="border-bottom:1px solid #ddd; padding:12px 0; margin-bottom:12px; direction:rtl; text-align:right; font-family:Arial,sans-serif;">
                        <h3 style="margin:0 0 6px 0; color:#4f46e5;">#${filtered.length - i} | ${t} — מאת: ${escapeHtml(item.senderName)} (${formatDateTime(item.timestamp)}) [${st}]</h3>
                        <p style="margin:0 0 6px 0; white-space:pre-wrap; font-size:14px; line-height:1.6;">${escapeHtml(item.message)}</p>
                        ${item.adminNote ? `<p style="margin:0; color:#6b7280; font-size:12px;"><strong>הערת מעקב:</strong> ${escapeHtml(item.adminNote)}</p>` : ''}
                    </div>
                `;
            }).join('');

            const htmlDoc = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40" dir="rtl">
                <head><meta charset="utf-8"><title>מסמך דיווחים ובקשות</title></head>
                <body style="direction:rtl; text-align:right; font-family:Arial,sans-serif;">
                    <h1>מסמך דיווחים, תקלות ובקשות - StudyStreak Pro</h1>
                    <p>הופק בתאריך: ${formatDateTime(new Date().toISOString())}</p>
                    <hr/>
                    ${lines}
                </body></html>
            `;
            const blob = new Blob(['\uFEFF', htmlDoc], { type: 'application/msword;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `StudyStreak_Feedback_Doc_${new Date().toISOString().slice(0,10)}.doc`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function initFeedbackDoc() {
            try {
                const localRaw = localStorage.getItem('studyStreak_system_feedback');
                if (localRaw) {
                    allItems = JSON.parse(localRaw) || [];
                    renderAll();
                }
            } catch (e) {}

            if (db) {
                db.collection('task_attachments').doc('system_feedback_doc').onSnapshot(doc => {
                    const dot = document.getElementById('sync-dot');
                    if (dot) dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0 shadow-[0_0_6px_rgba(16,185,129,0.6)]';
                    if (doc.exists && Array.isArray(doc.data()?.items)) {
                        const remoteItems = doc.data().items;
                        const byId = new Map();
                        [...allItems, ...remoteItems].forEach(item => {
                            if (item && item.id) byId.set(item.id, item);
                        });
                        allItems = Array.from(byId.values()).sort(
                            (a, b) => new Date(b.timestamp || 0).getTime() - new Date(a.timestamp || 0).getTime()
                        );
                        try {
                            localStorage.setItem('studyStreak_system_feedback', JSON.stringify(allItems));
                        } catch (e) {}
                    }
                    renderAll();
                }, err => {
                    console.warn('Firestore listener warning:', err);
                    const dot = document.getElementById('sync-dot');
                    if (dot) dot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500 shrink-0';
                    renderAll();
                });
            } else {
                renderAll();
            }
        }

        initFeedbackDoc();
    </script>
</body>
</html>
