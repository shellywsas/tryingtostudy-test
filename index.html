<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fafaf9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>StudyStreak Pro - ניהול למידה חכם לבגרויות</title>
    
    <!-- Favicon & Manifest -->
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link id="manifest-link" rel="manifest" href="manifest.json">
    <script src="js/pwa.js"></script>

    <!-- Firebase Compat SDKs (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    spacing: {
                        'safe-bottom': 'env(safe-area-inset-bottom)',
                        'safe-top': 'env(safe-area-inset-top)',
                    }
                }
            }
        };
    </script>
    
    <!-- React, ReactDOM, Babel & Chart.js -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom Styles -->
    <!-- Instant Splash Screen Styles -->
    <style>
        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #fafaf9;
            background: radial-gradient(circle at 50% 38%, #e0f2fe 0%, #fafaf9 68%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Heebo', sans-serif;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
            direction: rtl;
        }
        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: splashFadeIn 0.35s ease-out;
        }
        .splash-icon-wrapper {
            width: 104px;
            height: 104px;
            border-radius: 26px;
            box-shadow: 0 16px 36px -6px rgba(186, 230, 253, 0.7), 0 4px 12px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            background: #ffffff;
            margin-bottom: 20px;
            animation: splashFloat 2.6s ease-in-out infinite;
        }
        .splash-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .splash-title {
            font-size: 26px;
            font-weight: 900;
            color: #1c1917;
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }
        .splash-title-pro {
            background: linear-gradient(135deg, #9333ea, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .splash-subtitle {
            font-size: 13px;
            font-weight: 600;
            color: #78716c;
            margin: 0;
        }
        .splash-bar {
            width: 140px;
            height: 5px;
            background: #e7e5e4;
            border-radius: 99px;
            overflow: hidden;
            margin-top: 28px;
            position: relative;
        }
        .splash-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, #9333ea, #38bdf8);
            border-radius: 99px;
            animation: splashShimmer 1.3s ease-in-out infinite alternate;
        }
        .splash-loading-text {
            font-size: 11px;
            color: #a8a29e;
            font-weight: 700;
            margin-top: 12px;
        }
        @keyframes splashFadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes splashFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px); }
        }
        @keyframes splashShimmer {
            0% { left: -10%; width: 35%; }
            100% { left: 75%; width: 35%; }
        }
    </style>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen selection:bg-purple-200 selection:text-purple-900 pt-safe-top pb-safe-bottom">
    <div id="root">
        <!-- Instant Splash Screen (Shows in 0.05s before React & Babel load) -->
        <div id="splash-screen">
            <div class="splash-content">
                <div class="splash-icon-wrapper">
                    <img src="./icons/icon-192.png" alt="StudyStreak Pro" class="splash-icon" width="104" height="104">
                </div>
                <h1 class="splash-title">StudyStreak <span class="splash-title-pro">Pro</span></h1>
                <p class="splash-subtitle">המרחב שלך להצלחה בבגרויות 📚✨</p>
                <div class="splash-bar"></div>
                <div class="splash-loading-text">טוען את לוח הזמנים והמשימות... ⏳</div>
            </div>
        </div>
    </div>

    <!-- Modular Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/sync-helpers.js"></script>
    <script src="js/whatsapp-service.js"></script>
    <script type="text/babel" src="js/icons.jsx"></script>
    <script type="text/babel" src="js/app.jsx"></script>
</body>
</html>
