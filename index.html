<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fafaf9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>StudyStreak Pro - ניהול למידה חכם לבגרויות</title>
    
    <!-- Favicon & Manifest -->
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link id="manifest-link" rel="manifest" href="manifest.json">
    <script src="js/pwa.js"></script>

    <!-- Firebase Compat SDKs (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    spacing: {
                        'safe-bottom': 'env(safe-area-inset-bottom)',
                        'safe-top': 'env(safe-area-inset-top)',
                    }
                }
            }
        };
    </script>
    
    <!-- React, ReactDOM, Babel & Chart.js -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen selection:bg-purple-200 selection:text-purple-900 pt-safe-top pb-safe-bottom">
    <div id="root"></div>

    <!-- Modular Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/sync-helpers.js"></script>
    <script src="js/whatsapp-service.js"></script>
    <script type="text/babel" src="js/icons.jsx"></script>
    <script type="text/babel" src="js/app.jsx"></script>
</body>
</html>
